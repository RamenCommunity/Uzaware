plugins {
	id 'fabric-loom' version '1.6-SNAPSHOT'
	id 'maven-publish'
	id "com.github.johnrengelman.shadow" version "8.1.1"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {

}

loom {
    splitEnvironmentSourceSets()

	mods {
		"uzaware" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

configurations {
	library
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	implementation(platform("org.lwjgl:lwjgl-bom:3.3.1"))
	implementation("org.lwjgl:lwjgl-nanovg")

	//idiot XD
	implementation("org.lwjgl:lwjgl-nanovg::natives-windows")
	implementation("org.lwjgl:lwjgl-nanovg::natives-macos")
	implementation("org.lwjgl:lwjgl-nanovg::natives-linux")
	implementation("org.lwjgl:lwjgl-nanovg::natives-macos-arm64")
	implementation("org.lwjgl:lwjgl-nanovg::natives-linux-arm64")
	implementation("org.lwjgl:lwjgl-nanovg::natives-linux-arm32")

	implementation("se.michaelthelin.spotify:spotify-web-api-java:8.4.1")
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

build.dependsOn shadowJar
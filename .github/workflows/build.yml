name: build
on:
  push:
    paths:
      - "src/client/**"
      - "build.gradle"

jobs:
  build:
    strategy:
      matrix:
        java: [ 21, ]
    runs-on: ubuntu-22.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/wrapper-validation-action@v2
      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: gen name
        run: |
          archivesBaseName=$(grep 'archives_base_name' gradle.properties | sed 's/archives_base_name=//' | sed 's/ /_/g')
          version=$(grep 'mod_version' gradle.properties | sed 's/mod_version=//' | sed 's/ /_/g')
          commitHash=$(git rev-parse --short HEAD)
          name=$archives_base_name-$version-$commitHash
          echo modName=$modName >> $GITHUB_ENV
          echo fileName=$fileName >> $GITHUB_ENV

      - name: change file name
        run: |
          mv ./build/libs/*.jar ${{ env.fileName }}.jar

      - name: Get checksum
        run: |
          checksum=$(sha256sum ${{ env.fileName }}.jar | sed 's/${{ env.fileName }}.jar//g')
          echo checksum=$checksum >> $GITHUB_ENV